name: Build & Reverse-Engineer BitLife Arabic APK (Canary & SHA-256 Verified)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      apk_url:
        description: "رابط مباشر اختياري لتحميل ملف BitLife APK/XAPK الأصلي لتفكيكه وتعريبه"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK (platforms;android-34 & build-tools;34.0.0)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Reverse-Engineer & Patch Original BitLife APK (v4.0 Engine + Force-Inject)
        timeout-minutes: 35
        env:
          BITLIFE_APK_URL: ${{ github.event.inputs.apk_url }}
          PYTHONUNBUFFERED: "1"
        run: |
          chmod +x tools/download_and_patch_original_apk.sh
          ./tools/download_and_patch_original_apk.sh

      - name: Verify SHA-256 (Before / After / Final APK) & Canary Check ("العمر")
        run: |
          echo "========================================================================"
          echo " [WORKFLOW GATE] Verifying global-metadata.dat SHA-256 & Canary ('العمر')"
          echo "========================================================================"
          SHA_BEFORE=$(cat build_reverse_eng/sha256_before.txt)
          SHA_AFTER=$(cat build_reverse_eng/sha256_after.txt)
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/bin/Data/Managed/Metadata/global-metadata.dat > build_reverse_eng/extracted_from_final_apk.dat
          SHA_FINAL_APK=$(sha256sum build_reverse_eng/extracted_from_final_apk.dat | awk '{print $1}')

          echo "1. SHA-256 BEFORE PATCHING:  $SHA_BEFORE"
          echo "2. SHA-256 AFTER PATCHING:   $SHA_AFTER"
          echo "3. SHA-256 INSIDE FINAL APK: $SHA_FINAL_APK"

          if [ "$SHA_BEFORE" = "$SHA_AFTER" ]; then
            echo "[FATAL] global-metadata.dat was NOT modified by patcher!" >&2
            exit 1
          fi
          if [ "$SHA_AFTER" != "$SHA_FINAL_APK" ]; then
            echo "[FATAL] Packaged global-metadata.dat inside APK does NOT match patched file!" >&2
            exit 1
          fi

          python3 -u tools/reverse_engineer_bitlife_apk.py --verify-apk-canary app/build/outputs/apk/debug/app-debug.apk "$SHA_AFTER" "$SHA_BEFORE"

      - name: Upload Canary-Verified Arabic BitLife APK
        uses: actions/upload-artifact@v4
        with:
          name: bitlife-arabic-canary-verified-apk
          path: app/build/outputs/apk/debug/app-debug.apk
