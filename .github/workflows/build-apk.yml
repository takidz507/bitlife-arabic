name: Build Standalone Native Arabic Life-Simulator APK (v5.0)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-standalone-native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Standalone 64-Bit Native Android APK
        run: |
          gradle assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BitLife-Arabic-Standalone-v5.apk

      - name: Upload Standalone Playable Arabic APK
        uses: actions/upload-artifact@v4
        with:
          name: bitlife-arabic-standalone-native-v5-apk
          path: app/build/outputs/apk/debug/BitLife-Arabic-Standalone-v5.apk
