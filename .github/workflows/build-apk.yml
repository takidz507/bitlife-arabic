name: Build & Reverse-Engineer BitLife Arabic APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      apk_url:
        description: "رابط مباشر اختياري لتحميل ملف BitLife APK/XAPK الأصلي لتفكيكه وتعريبه"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK (platforms;android-34 & build-tools;34.0.0)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Base Arabic Android Project (gradle assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: Reverse-Engineer & Patch Original BitLife APK (Apktool + IL2CPP global-metadata.dat)
        env:
          BITLIFE_APK_URL: ${{ github.event.inputs.apk_url }}
        run: |
          chmod +x tools/download_and_patch_original_apk.sh
          ./tools/download_and_patch_original_apk.sh

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitlife-arabic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
